# Workflow: Deploy to GitHub Pages
# Branch: main
# Purpose: Build and deploy portfolio to GitHub Pages with Node.js 23
# Triggers: Push to main branch
# Dependencies: pnpm, Node.js 23, Astro
# Outputs: Static site deployed to GitHub Pages

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages-deployment
  cancel-in-progress: false

jobs:
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1
          clean: true

      - name: Setup Node.js 23
        uses: actions/setup-node@v4
        with:
          node-version: "23"
          cache: "pnpm"

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run npm audit
        run: pnpm audit --audit-level=high
        continue-on-error: true

      - name: Check for secrets in code
        run: |
          echo "🔍 Scanning for secrets in code..."
          # Check for common secret patterns
          if grep -r -E "(sk-[a-zA-Z0-9]{48}|xoxb-[a-zA-Z0-9-]{10,}|ghp_[a-zA-Z0-9]{36}|gho_[a-zA-Z0-9]{36}|-----BEGIN (RSA |DSA |EC |OPENSSH )?PRIVATE KEY-----)" --include="*.ts" --include="*.tsx" --include="*.mjs" --include="*.js" --include="*.json" --include="*.md" --include="*.astro" --include="*.css" --exclude-dir=node_modules --exclude-dir=dist --exclude-dir=.git . 2>/dev/null; then
            echo "❌ Potential secrets found in code!"
            exit 1
          fi
          echo "✅ No secrets detected"

      - name: Check for debug statements
        run: |
          echo "🔍 Checking for debug statements..."
          if grep -r -E "(console\.(log|debug|warn|error)|debugger)" --include="*.ts" --include="*.tsx" --include="*.mjs" --include="*.js" --include="*.astro" --exclude-dir=node_modules --exclude-dir=dist --exclude-dir=.git --exclude-dir=scripts --exclude-dir=tests --exclude="*.test.*" --exclude="*.spec.*" src/ 2>/dev/null; then
            echo "⚠️  Debug statements found in src/ (review recommended)"
          fi
          echo "✅ Debug check completed"

  build:
    name: Build Portfolio
    needs: security-scan
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1
          clean: true

      - name: Setup Node.js 23
        uses: actions/setup-node@v4
        with:
          node-version: "23"
          cache: "pnpm"

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Pre-build validation
        run: |
          echo "🔍 Validating file sizes..."
          node scripts/validate-file-sizes.mjs
          echo "✅ Validation completed"

      - name: Build Astro site
        run: pnpm run build
        env:
          PUBLIC_WEB3FORMS_ACCESS_KEY: ${{ secrets.PUBLIC_WEB3FORMS_ACCESS_KEY }}
          NODE_ENV: production

      - name: Validate build output
        run: |
          echo "🔍 Validating build output..."
          node scripts/validate-file-sizes.mjs dist
          if [ ! -d "dist" ]; then
            echo "❌ Build directory not found"
            exit 1
          fi
          echo "✅ Build output validated"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Deployment summary
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          echo "✅ Deployment completed successfully"
          echo "🌐 Site URL: $SITE_URL"
